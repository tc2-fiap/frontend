server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real but permissive — not a lockdown. script-src/connect-src/frame-src
    # allow accounts.google.com because GoogleSignInButton.tsx loads Google's
    # gsi/client script and renders its button in an iframe; connect-src also
    # allows api.github.com for the System Health page's commit-drift check
    # (github.ts). img-src allows any https/http source (CoverImageUrl is
    # admin-set, backend-allowlisted to those two schemes only — see
    # notes.md 84) plus data: for the PIX QR code, delivered as a base64
    # data URI (PaymentStatusCard.tsx). style-src needs 'unsafe-inline'
    # because this app uses React's style={{...}} prop in several places,
    # which CSP's style-src restricts the same as a <style> tag.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'self' https://api.github.com https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback — client-side routing (React Router) means a deep link
    # or refresh on e.g. /catalog has no matching file on disk. /api/* never
    # reaches this container: the Ingress routes it to the backend services
    # directly, by path, before nginx ever sees it.
    location / {
        try_files $uri /index.html;
    }
}
